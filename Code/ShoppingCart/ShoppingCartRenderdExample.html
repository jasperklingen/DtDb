<!doctype html>
<html lang="nl">

<head>
    <meta charset="utf-8" />
    <title>Shopping Cart</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap"
        rel="stylesheet" />
    <style>
        :root {
            --font-ui: 'Plus Jakarta Sans', sans-serif;
            --font-mono: 'DM Mono', monospace;
            --page: #edf1f7;
            --card: #ffffff;
            --border: #b8c4d4;
            --text-primary: #080e18;
            --text-muted: #5a6878;
            --accent-blue: #1848a0;
            --accent-cyan: #0a7a8e;
            --success-bg: #cceede;
            --success-text: #064830;
            --warn-bg: #fde8b8;
            --warn-text: #7a4400;
            --neutral-bg: #dde4ee;
            --neutral-text: #445060;
            --note-bg: #e8eef8;
            --note-border: #1848a0;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --page: #080c14;
                --card: #101624;
                --border: #1e2d45;
                --text-primary: #dce8f8;
                --text-muted: #384860;
                --accent-blue: #3a78e8;
                --accent-cyan: #20d8a0;
                --success-bg: #082818;
                --success-text: #20d8a0;
                --warn-bg: #281800;
                --warn-text: #e8a820;
                --neutral-bg: #101e30;
                --neutral-text: #384860;
                --note-bg: #0c1420;
                --note-border: #3a78e8;
            }
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-ui);
            background: var(--page);
            color: var(--text-primary);
            margin: 0;
            min-height: 100vh;
        }

        /* ── Page header ── */
        .page-header {
            background: var(--card);
            padding: 20px 28px 16px;
            border-top: 3px solid var(--accent-blue);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
        }

        .page-header-logo {
            height: 28px;
            width: auto;
            flex-shrink: 0;
            opacity: 0.9;
        }

        .page-header-title {
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            color: var(--text-primary);
            margin: 0 0 8px;
        }

        .page-header-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }

        .page-header-sub {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .page-header-badge {
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.4px;
            padding: 2px 8px;
            border-radius: 3px;
            background: var(--note-bg);
            color: var(--accent-blue);
            border: 0.5px solid var(--border);
            font-family: var(--font-mono);
        }

        /* ── Content layout ── */
        .content {
            padding: 20px 28px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            max-width: 860px;
        }

        /* ── Note ── */
        .note {
            border-left: 2px solid var(--note-border);
            background: var(--note-bg);
            padding: 8px 12px;
            border-radius: 0 5px 5px 0;
            font-size: 12px;
            font-style: italic;
            color: var(--text-muted);
        }

        /* ── Card ── */
        .card {
            background: var(--card);
            border: 0.5px solid var(--border);
            border-radius: 8px;
            padding: 16px 18px;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
        }

        .card.accent-blue::before {
            background: var(--accent-blue);
        }

        .card.accent-cyan::before {
            background: var(--accent-cyan);
        }

        /* ── Section label ── */
        .section-label {
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.7px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin: 0 0 10px;
        }

        /* ── Tree ── */
        ul.treeRoot,
        ul.treeRoot ul {
            list-style: none;
            margin: 0;
            padding-left: 20px;
            position: relative;
        }

        ul.treeRoot ul::before {
            content: '';
            position: absolute;
            top: 0;
            left: 8px;
            bottom: 0;
            width: 1px;
            border-left: 1px solid var(--border);
        }

        li {
            position: relative;
            padding-left: 16px;
        }

        li::before {
            content: '';
            position: absolute;
            top: 12px;
            left: 0;
            width: 12px;
            height: 1px;
            border-top: 1px solid var(--border);
        }

        ul.treeRoot>li {
            padding-left: 0;
        }

        ul.treeRoot>li::before {
            content: none;
        }

        ul.treeRoot>li>ul {
            padding-left: 20px;
        }

        ul.treeRoot>li>ul::before {
            top: 0;
        }

        .node {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 3px 0;
        }

        .nodeLabel {
            user-select: none;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-primary);
        }

        .toggle-arrow {
            cursor: pointer;
            user-select: none;
            width: 14px;
            display: inline-block;
            font-size: 10px;
            color: var(--text-muted);
        }

        input[type="number"] {
            width: 64px;
            font-family: var(--font-mono);
            font-size: 12px;
            padding: 3px 6px;
            border: 0.5px solid var(--border);
            border-radius: 4px;
            background: var(--page);
            color: var(--text-primary);
        }

        input[type="number"]:focus {
            outline: none;
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent-blue) 15%, transparent);
        }

        /* ── Actions ── */
        .actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            font-family: var(--font-ui);
            font-size: 13px;
            font-weight: 600;
            padding: 8px 18px;
            border-radius: 5px;
            cursor: pointer;
            border: none;
            background: var(--accent-blue);
            color: #fff;
            letter-spacing: 0.2px;
            transition: opacity 0.15s;
        }

        .btn:hover {
            opacity: 0.88;
        }

        .btn:active {
            opacity: 0.75;
        }

        /* ── Status ── */
        #status {
            font-size: 12px;
            font-weight: 600;
            font-family: var(--font-mono);
        }

        /* ── Result list ── */
        #webhookList {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .batch-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.6px;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        .batch-header:first-child {
            margin-top: 0;
        }

        .batch-header::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .result-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 7px 12px;
            background: var(--card);
            border: 0.5px solid var(--border);
            border-radius: 6px;
            font-size: 12px;
        }

        .result-row .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            flex-shrink: 0;
            background: var(--accent-cyan);
        }

        .result-row .row-name {
            font-weight: 500;
            color: var(--text-primary);
            flex: 1;
        }

        .result-row .row-meta {
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--text-muted);
        }
    </style>
</head>

        function parseCsvTree(csv) {
            const lines = csv.trim().split(/\r?\n/);
            const dataLines = lines.slice(1).filter(l => l.trim().length > 0);
            const root = { name: 'Tree Root', url: null, path: ['Tree Root'], children: [] };

            function ensureChild(parent, name, isTopLevel = false) {
                const existing = parent.children.find(c => c.name === name);
                if (existing) return existing;
                const newPath = isTopLevel ? [name] : parent.path.concat(name);
                const child = { name, url: null, path: newPath, children: [] };
                parent.children.push(child);
                return child;
            }

            for (const raw of dataLines) {
                const line = raw.trim();
                const commaIndex = line.indexOf(',');
                if (commaIndex <= 0) continue;
                const url = line.substring(0, commaIndex).trim();
                const path = line.substring(commaIndex + 1).trim();
                const segments = path.split('|').map(s => s.trim()).filter(s => s.length > 0);
                if (segments.length === 0) continue;
                let current = root;
                current = ensureChild(current, segments[0], true);
                for (let i = 1; i < segments.length; i++) {
                    current = ensureChild(current, segments[i]);
                }
                current.url = url;
            }
            return root;
        }

        function renderNode(node) {
            const li = document.createElement('li');
            const header = document.createElement('div');
            header.className = 'node';

            let toggle = null;
            if (node.children && node.children.length > 0) {
                toggle = document.createElement('span');
                toggle.className = 'toggle-arrow';
            }

            const input = document.createElement('input');
            input.type = 'number';
            input.min = 0;
            input.max = 20;
            input.value = 0;
            input.dataset.nodeId = node.url ? node.url : ('path:' + (node.path ? node.path.join(' / ') : node.name));
            input.addEventListener('input', () => {
                let v = parseInt(input.value);
                if (v < 0) input.value = 0;
                if (v > 20) input.value = 20;
            });

            const label = document.createElement('span');
            label.className = 'nodeLabel';
            label.textContent = node.name;
            if (toggle) {
                label.style.cursor = 'pointer';
                label.addEventListener('click', () => toggle.click());
            }

            header.appendChild(toggle || document.createElement('span'));
            header.appendChild(input);
            header.appendChild(label);
            li.appendChild(header);

            if (node.children && node.children.length > 0) {
                const ul = document.createElement('ul');
                ul.style.listStyle = 'none';
                for (const child of node.children) {
                    ul.appendChild(renderNode(child));
                }
                li.appendChild(ul);

                const isRoot = node.path && node.path.length === 1;
                if (isRoot) {
                    ul.style.display = 'block';
                    toggle.dataset.state = 'open';
                    toggle.textContent = '▼';
                } else {
                    ul.style.display = 'none';
                    toggle.dataset.state = 'closed';
                    toggle.textContent = '▶';
                }

                toggle.addEventListener('click', function () {
                    const isOpen = toggle.dataset.state === 'open';
                    toggle.dataset.state = isOpen ? 'closed' : 'open';
                    toggle.textContent = isOpen ? '▶' : '▼';
                    ul.style.display = isOpen ? 'none' : 'block';
                });
            }

            return li;
        }

        function renderTreeFromData(data) {
            const rootUl = document.createElement('ul');
            rootUl.id = 'treeRoot';
            rootUl.className = 'treeRoot';
            if (data.children && data.children.length > 0) {
                for (const child of data.children) {
                    rootUl.appendChild(renderNode(child));
                }
            }
            return rootUl;
        }

        function loadTree() {
            const rootNode = parseCsvTree(csvData);
            const container = document.getElementById('treeContainer');
            container.innerHTML = '';
            container.appendChild(renderTreeFromData(rootNode));
            setStatus('Tree loaded', false);
        }

        function collectSelectedNodes() {
            const root = document.getElementById('treeRoot');
            if (!root) return [];
            const selections = [];
            root.querySelectorAll('input[type="number"]').forEach(input => {
                const val = parseInt(input.value, 10);
                if (!Number.isNaN(val) && val > 0) {
                    selections.push({
                        id: input.dataset.nodeId,
                        label: input.nextSibling.textContent,
                        count: val
                    });
                }
            });
            return selections;
        }

        async function submitWebhook() {
            const selections = collectSelectedNodes();
            if (selections.length === 0) {
                setStatus('No items selected with quantity > 0.', true);
                return;
            }

            const webhookList = document.getElementById('webhookList');
            setStatus(`Sending ${selections.length} item(s)…`, false);

            const now = new Date();
            const timestamp = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            const batchHeader = document.createElement('div');
            batchHeader.className = 'batch-header';
            batchHeader.textContent = timestamp;
            webhookList.appendChild(batchHeader);

            let totalJobs = 0;
            selections.forEach(item => {
                // Same request body for every copy: one SOV job per copy, each with COPIES=1
                const body = {
                    repository: 'SOV',
                    workspace: 'SOV.fmw',
                    publishedParameters: {
                        CONFIG_XLSX: '/SOV/Config/SOV.xlsx',
                        SELECTED_GROUP: item.id,
                        COPIES: '1',
                        HubLaces: '',
                        RelaticsWorkspace: 'd',
                        BATCH_SIZE: '1000',
                        SHOPPINGCART_UUID: '12221'
                    }
                };
                if (MAX_JOB_RUNTIME > 0) body.maxJobRuntime = MAX_JOB_RUNTIME;

                for (let i = 0; i < item.count; i++) {
                    fetch(JOB_SUBMIT_URL, {
                        method: 'POST',
                        headers: {
                            'Authorization': `fmetoken token=${FME_TOKEN}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(body)
                    })
                        .then(res => { if (!res.ok) console.warn(`Submit failed for ${item.label} (copy ${i + 1}): HTTP ${res.status}`); })
                        .catch(err => console.warn(`Error sending ${item.label} (copy ${i + 1}):`, err));
                    totalJobs++;
                }

                const row = document.createElement('div');
                row.className = 'result-row';
                row.innerHTML = `<span class="dot"></span><span class="row-name">${item.label}</span><span class="row-meta">${item.count} job(s) sent</span>`;
                webhookList.appendChild(row);
            });

            // Reset all selected inputs back to 0
            const root = document.getElementById('treeRoot');
            if (root) {
                root.querySelectorAll('input[type="number"]').forEach(input => {
                    if (parseInt(input.value, 10) > 0) input.value = 0;
                });
            }

            setStatus(`Done — ${totalJobs} job(s) submitted for ${selections.length} item(s).`, false);
        }

        function setStatus(msg, isError) {
            const el = document.getElementById('status');
            el.textContent = msg;
            el.style.color = isError ? '#c0392b' : 'var(--accent-cyan)';
        }

        document.getElementById('submitBtn').addEventListener('click', submitWebhook);
        loadTree();
    </script>
